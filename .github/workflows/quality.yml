name: Quality

on:
  push:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository quality
    # Pinned, not "ubuntu-latest". The runner image is this workflow's only real
    # dependency -- there are no actions to pin and no package manifest -- and it is
    # what supplies bash, shellcheck and jq. A floating label re-points without a
    # commit, so a shellcheck that ships a new default rule set would fail a build
    # nothing in this repository had touched. ubuntu-latest resolves to 24.04 today,
    # so this pin changes nothing now and only stops the silent roll later.
    # ubuntu-26.04 exists but is still preview; revisit when it reaches GA.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # A direct fetch avoids making CI depend on the separate Actions download
      # service. This repository is public, so no token or persisted credentials
      # are needed to fetch the exact commit that triggered the workflow.
      - name: Fetch repository
        run: |
          set -euo pipefail
          git init --initial-branch=ci .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Show quality tool versions
        run: |
          set -euo pipefail
          bash --version
          shellcheck --version
          jq --version

      - name: Run local quality pipeline
        run: ./localPipeline.sh --no-live
