# The repository has one quality gate: localPipeline.sh. CI invokes that same script
# instead of reconstructing its checks in YAML, so local and hosted verification stay
# identical. The checkout is implemented with git itself to keep this one-script
# project independent of downloadable Actions.
name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository quality
    # Pinned, not "ubuntu-latest". The runner image is this workflow's only real
    # dependency -- there are no actions to pin and no package manifest -- and it is
    # what supplies bash, shellcheck and jq. A floating label re-points without a
    # commit, so a shellcheck that ships a new default rule set would fail a build
    # nothing in this repository had touched -- and ubuntu-latest moves from 24.04 to
    # 26.04 in November 2026. 26.04 is GA and ships shellcheck 0.11.0, bash 5.3 and
    # jq 1.8, the same generation the local gate is run with, so CI and a developer's
    # machine apply the same rule set. Re-pin deliberately, never by drift.
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      # A direct fetch avoids making CI depend on the separate Actions download
      # service. This repository is public, so no token or persisted credentials
      # are needed to fetch the exact commit that triggered the workflow.
      - name: Fetch repository
        run: |
          set -euo pipefail
          git init --initial-branch=ci .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # GITHUB_REF names the pushed branch, pull-request merge ref, or manually
          # selected branch. Verify FETCH_HEAD as well, so the gate cannot silently
          # test a different revision from the one GitHub says triggered the run.
          git fetch --no-tags --depth=1 origin "$GITHUB_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Show quality tool versions
        run: |
          set -euo pipefail
          bash --version
          shellcheck --version
          jq --version

      - name: Run local quality pipeline
        run: ./localPipeline.sh --no-live
